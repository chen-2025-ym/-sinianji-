<style>
:root{
  --bg:#FAF8F3; --card:#FFFFFF; --card2:#F4F2EC;
  --ink:#1E2A23; --ink2:#6E7B72; --ink3:#A3ADA6;
  --green:#2F6B50; --green2:#3E8E68; --mint:#E7F0E9; --mint2:#D6E7DB;
  --tan:#F5EBD8; --tanink:#8A6A32;
  --red:#C0392B; --redbg:#FCEDEB;
  --blue:#2E86C1; --amber:#D9A521;
  --line:#EAE6DC;
  --r-card:22px; --r-lg:26px;
  --sh:0 2px 10px rgba(31,42,35,.05);
  --sh2:0 6px 22px rgba(31,42,35,.08);
  --pad:18px;
}
[data-theme="dark"]{
  --bg:#12160F; --card:#1C221B; --card2:#242B23;
  --ink:#EAF0EA; --ink2:#9FAEA4; --ink3:#6E7C73;
  --green:#4E9E78; --green2:#3E8E68; --mint:#1F2B24; --mint2:#26332B;
  --tan:#2C2820; --tanink:#D8BE86;
  --red:#E2705F; --redbg:#33211E;
  --line:#2B332B;
  --sh:0 2px 10px rgba(0,0,0,.4); --sh2:0 6px 22px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{font-size:calc(16px * var(--scale,1))}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
img{display:block}

/* ---------- 外壳 ---------- */
.shell{max-width:460px;margin:0 auto;min-height:100%;position:relative;padding-bottom:96px}
.page{padding:8px var(--pad) 0;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.top h1{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.01em}
.pill{font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;background:var(--tan);color:var(--tanink)}
.top .sp{flex:1}
.avbtn{width:40px;height:40px;border-radius:999px;background:var(--mint);display:grid;place-items:center}

/* ---------- 吉祥物 ---------- */
.mascot{display:flex;flex-direction:column;align-items:center;padding:14px 0 4px}
.mascot .circle{width:118px;height:118px;border-radius:999px;background:var(--mint);display:grid;place-items:center}
.mascot .circle svg{width:74px;height:74px}
.bubble{margin-top:12px;background:var(--mint);color:var(--green);font-size:.86rem;font-weight:600;
  padding:.42rem .95rem;border-radius:999px;max-width:88%;text-align:center}
.bigtitle{text-align:center;font-size:1.75rem;font-weight:800;letter-spacing:-.02em;margin:14px 0 2px}

/* ---------- 主卡片 ---------- */
.hero{
  background:linear-gradient(160deg,#357457,#2A6047);color:#fff;border-radius:var(--r-lg);
  padding:30px 22px;text-align:center;margin-top:14px;box-shadow:0 10px 24px rgba(47,107,80,.22)
}
.hero .num{font-size:3.6rem;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .num span{font-size:1.05rem;font-weight:600;margin-left:.25rem;opacity:.85}
.hero .sub{margin-top:10px;font-size:.82rem;opacity:.9}
.hero .bar{margin-top:16px;height:7px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.hero .bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s}
.quote{text-align:center;font-style:italic;color:var(--ink2);font-size:.86rem;margin:16px 6px 4px;line-height:1.7}

/* ---------- 区块 ---------- */
.sec{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px}
.sec h2{margin:0;font-size:1.06rem;font-weight:800}
.sec .n{margin-left:auto;font-size:.8rem;color:var(--ink2);font-weight:600}

/* ---------- 任务卡 ---------- */
.task{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh);padding:14px 15px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px}
.task .dot{width:9px;height:9px;border-radius:99px;flex:0 0 auto;margin-top:2px}
.task .body{flex:1;min-width:0}

.task .m{font-size:.76rem;color:var(--ink2);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.dobtn.ok{background:var(--mint);color:var(--green)}

.row .tx{flex:1;min-width:0}
.row .tt{font-size:.94rem;font-weight:700}
.row .ss{font-size:.76rem;color:var(--ink2);margin-top:2px}
.chev{color:var(--ink3);font-size:1.1rem;flex:0 0 auto}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green2);transition:width .4s}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh);padding:14px;text-align:left}
.tile .e{font-size:1.35rem}
.tile .t{font-size:.88rem;font-weight:700;margin-top:8px}
.tile .s{font-size:.72rem;color:var(--ink2);margin-top:2px}

/* ---------- 顶部分段 ---------- */
.seg{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:999px;margin:10px 0 14px}
.seg button{flex:1;padding:.42rem .5rem;border-radius:999px;font-size:.84rem;font-weight:700;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}

/* ---------- 知识点卡 ---------- */
.pt{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh);padding:14px 15px;margin-bottom:10px}

.pt .h .tt{flex:1;min-width:0}
.pt .h h3{margin:0;font-size:.97rem;font-weight:750;line-height:1.4}
.pt .h p{margin:4px 0 0;font-size:.8rem;color:var(--ink2)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.tag{font-size:.68rem;font-weight:700;padding:.14rem .5rem;border-radius:999px;background:var(--mint);color:var(--green)}
.tag.g{background:var(--card2);color:var(--ink2)}
.tag.o{background:var(--tan);color:var(--tanink)}
.dots{color:var(--amber);font-size:.66rem;letter-spacing:1.5px}
.star{font-size:1.15rem;color:var(--ink3);line-height:1;padding:2px}
.star.on{color:var(--amber)}

/* ---------- 详情 ---------- */

.blk.tips{background:var(--tan);color:var(--tanink)}

.ln .i{flex:0 0 auto;width:20px;height:20px;border-radius:99px;background:var(--green);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;margin-top:2px}

.ln .dt{font-size:.86rem;color:var(--ink2)}

.mm:last-child{margin-bottom:0}

.mm .r i{width:7px;height:7px;border-radius:99px;background:var(--green2);flex:0 0 auto}

.mm li{font-size:.82rem;color:var(--ink2);padding:1px 0}

.fb .x{color:var(--ink2);font-size:.81rem;margin-top:3px}

.fcbtn.yes{background:var(--green);color:#fff}

.result{text-align:center;padding:30px 10px}

.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:18px 0}
.box{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px;text-align:center}
.box .v{font-size:1.4rem;font-weight:800;color:var(--green)}
.box .k{font-size:.72rem;color:var(--ink2);margin-top:2px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;

.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;color:var(--ink3);font-size:.66rem;font-weight:700}
.tabs button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--green)}
.tabs button[aria-selected="true"] svg{stroke-width:2.1}

.empty{text-align:center;padding:44px 20px;color:var(--ink2);font-size:.86rem}
.empty .e{font-size:2.4rem;margin-bottom:8px}

.stat-line .k{color:var(--ink2)}
.stat-line .v{font-weight:800}
.week{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.week .d .b{width:100%;border-radius:8px 8px 4px 4px;background:var(--green2);min-height:4px}
.week .d .b.zero{background:var(--card2)}
.week .d .l{font-size:.62rem;color:var(--ink3)}
.week .d .v{font-size:.6rem;color:var(--ink2);height:12px}

.sw:last-child{border-bottom:0}
.sw .l{font-size:.88rem;font-weight:600}
.sw .d{font-size:.74rem;color:var(--ink2);margin-top:2px}
.seg2{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:999px;margin-bottom:12px}
.seg2 button{flex:1;padding:.4rem;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--ink2)}
.seg2 button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}

                                         "content":  "必写生字｜四下要求会写的生字很多，如徐、篱、疏、杂、宿、剥、蹲、序、率、蝙、蝠、霸、鹰、蔬、繁、藤、潇、朦、胧、寂、寞、霞、臀、骏、驰、诺、舱、遣、覆、屏、稿、勃、厌、坝、孵、警、掘、啼、苟、譬、倔、芜、凄、惨\n易错笔画｜“序、廓”是广字头，先写点再写横撇；“蔬、蕉”是草字头，横要写得长一些盖住下面；“朦、胧”左边是月字旁，不要写成日字旁\n结构易混｜“辫（辫子）、辨（分辨）、辩（辩论）、瓣（花瓣）”的区别在中间部分，分别是纟、一点一撇、言字旁、瓜\n笔顺规则｜“鼎、繁、鹰”等字先写里头后写两边；“达、适”等半包围结构的字先写里面再写外面\n书写要点｜横平竖直、间架匀称；“微”的右边是反文旁“攵”，不要写成折文旁；“瘦、康”不要漏写点",

                                         "content":  "什么是扩句｜给句子主干加上合适的修饰词语，使表达更具体，如“花开”可扩成“鲜艳的桃花在春风里悄悄开放”\n扩句方法｜先找主干（谁+做什么、谁+是什么、谁+怎么样），再在名词前加“什么样的”，在动词前加“怎样地”\n什么是缩句｜去掉所有修饰、限制的词语，只留主干，不改原意、不改句式\n缩句口诀｜“的、地”前面的修饰语去掉，“得”后面补充说明的内容去掉\n必须保留｜否定词“不、没、别、没有”和“把、被”以及“着、了、过”都不能删，否则句意会变\n注意要点｜缩句后句子要通顺完整，不能丢掉主语或谓语",
                                         "tips":  "“我不小心打碎了花瓶”可缩成“我打碎了花瓶”，“不小心”是修饰语；但“我没打碎花瓶”不能缩成“我打碎花瓶”，否定词必须保留。",
                                         "formula":  "缩句只留主干，删去“的、地”和“得”后；否定词语要保留，句意语气不能丢。",

                                         "content":  "比喻｜把甲事物比作乙事物，常用“像、好像、仿佛、成了”，本体和喻体要有相似点且不同类\n拟人｜把物当作人来写，赋予人的动作和情感，如“桃树、杏树、梨树，你不让我，我不让你”\n排比｜三个或三个以上结构相似、意思相关的句子连用，增强语势，如《绿》中“刮的风是绿的，下的雨是绿的，流的水是绿的”\n夸张｜故意扩大或缩小，如“白发三千丈”“巴掌大的地方”\n反问改陈述｜去掉“难道、怎么、岂”，肯定变否定、否定变肯定，问号改句号\n陈述改反问｜加上“难道……吗”或“怎能不……呢”，句意不变而语气更强",
                                         "tips":  "带“像”的句子不一定是比喻，表示比较、猜测、举例的都不是，如“他像他爸爸”“天像要下雨了”。改反问句时意思不能变：肯定句改反问句要加否定词。",

                                         "summary":  "写清一件事，做到有条理有细节",
                                         "content":  "开头点题｜开头交代人物或事件，一两句话点明题目，如“我最熟悉的人是我的同桌小明”\n按顺序写｜写事按“起因—经过—结果”写，重点写经过；写人可用“总—分—总”的结构\n抓住细节｜用动作、语言、神态、心理描写让人物活起来，如“我攥紧拳头，手心全是汗”\n用上修辞｜恰当运用比喻、拟人、排比，让句子生动，如“太阳像个大火球，把大地烤得滚烫”\n表达真情｜写自己的真实感受，如“那一刻，我心里像揣着一只小兔子”\n字数与结构｜400字左右，分4到5个自然段，段落之间要有过渡句",
                                         "tips":  "写事不要只写“很开心、很有意思”，要把最感人的一幕写具体：谁做了什么、怎么做的、说了什么。结尾写出自己的感受或收获，不要空喊口号。",

                                         "content":  "咏梅词｜毛泽东《卜算子·咏梅》：风雨送春归，飞雪迎春到。已是悬崖百丈冰，犹有花枝俏。俏也不争春，只把春来报。待到山花烂漫时，她在丛中笑\n词句理解｜“犹有花枝俏”的“犹”是还、仍然；“俏也不争春”写梅花谦逊；全词借梅花赞美不畏严寒、乐观奉献的品格\n名人名言｜“诗和音乐一样，生命全在节奏。——朱光潜”；“诗是人类向未来寄发的信息，诗给人类以朝向理想的勇气。——艾青”\n名人名言｜“诗是强烈感情的自然流露，它源于宁静中回忆起来的情感。——[英国]华兹华斯”\n勤学名句｜“一日读书一日功，一日不读十日空”；“学习不怕根底浅，只要迈步总不迟”；“书山有路勤为径，学海无涯苦作舟”\n背诵方法｜先理解意思再背，按上阕、下阕分层记忆，注意“烂漫、悬崖、犹”等易错字",
                                         "tips":  "“卜算子”是词牌名。背诵要写准“烂漫”，不写“烂慢”；写准“悬崖”，不写“县崖”。名言要记准作者：节奏是朱光潜，理想勇气是艾青，强烈感情是华兹华斯。",

<script>
(function(){
"use strict";

/* ============================ 数据 ============================ */
var SUBJ = JSON.parse(document.getElementById("payload").textContent);
var P = {};                  // 知识点索引：code -> {si,ui,pi,p,u,s}
var U = {};                  // 单元索引：key(si:ui) -> {si,ui,u,s}
var COLORS = { chinese:"#D9534F", math:"#2E86C1", english:"#28A745" };
var ICONS  = { chinese:"📖", math:"📐", english:"🔤" };
var QUOTES = [
 "不是变得自律，而是慢慢过你喜欢的生活。",
 "不积跬步，无以至千里。",
 "读书破万卷，下笔如有神。",
 "今天比昨天多懂一点点，就够了。",
 "温故而知新，可以为师矣。",
 "慢慢来，比较快。"
];
SUBJ.forEach(function(s, si){
  s.units.forEach(function(u, ui){
    U[si+":"+ui] = { si:si, ui:ui, u:u, s:s };
    u.points.forEach(function(p, pi){
      P[s.subject+":"+p.id] = { si:si, ui:ui, pi:pi, p:p, u:u, s:s, code:s.subject+":"+p.id };
    });
  });
});

/* ============================ 本地存储 ============================ */
var KEY = "s4web.v1";
var S = { min:{}, minSub:{}, ans:{}, pt:{}, rev:{}, wrong:{}, fav:{}, checkin:{}, done:{},
          cfg:{ theme:"light", scale:1, goal:20, quote:-1 } };

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var o = JSON.parse(raw); for(var k in o){ if(S[k] !== undefined) S[k] = o[k]; } }
  }catch(e){}
  if(S.cfg.quote < 0) S.cfg.quote = Math.floor(Math.random()*QUOTES.length);
}
var saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(function(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}, 120); }

function dayKey(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function today(){ return dayKey(); }
function addDays(n){
  var d = new Date(); d.setDate(d.getDate()+n); return dayKey(d);
}
function todayMin(){ return S.min[today()] || 0; }
function addMin(m, subjCode){
  var t = today();
  S.min[t] = +( (S.min[t]||0) + m ).toFixed(2);
  if(subjCode){
    S.minSub[t] = S.minSub[t] || {};
    S.minSub[t][subjCode] = +( (S.minSub[t][subjCode]||0) + m ).toFixed(2);
  }
  save();
}
var INTERVALS = [0,1,2,4,7,15,30];
function schedule(code, ok){
  var r = S.rev[code] || { stage:0, date:today() };
  r.stage = ok ? Math.min(r.stage + 1, INTERVALS.length-1) : 0;
  r.date = addDays(INTERVALS[r.stage]);
  S.rev[code] = r; save();
}
function dueList(){
  var t = today(), out = [];
  for(var code in S.rev){
    var r = S.rev[code];
    if(r.date <= t && P[code] && !(S.done[t] && S.done[t][code])) out.push(P[code]);
  }
  out.sort(function(a,b){
    var wa = (S.pt[a.code] && S.pt[a.code].a >= 2 && mastery(a.code) < .6) ? 1 : 0;
    var wb = (S.pt[b.code] && S.pt[b.code].a >= 2 && mastery(b.code) < .6) ? 1 : 0;
    return wb - wa || (S.rev[a.code].date < S.rev[b.code].date ? -1 : 1);
  });
  return out;
}
function freshList(n){
  var out = [];
  for(var code in P){ if(!S.rev[code]) out.push(P[code]); }
  out.sort(function(a,b){ return a.code < b.code ? -1 : 1; });
  return out.slice(0, n || 4);
}
function mastery(code){
  var x = S.pt[code]; if(!x || !x.a) return 0;
  return x.c / x.a;
}
function subjMastery(si){
  var code = SUBJ[si].subject, sum = 0, n = 0;
  for(var c in P){ if(P[c].s.subject === code){ sum += mastery(c); n++; } }
  return n ? sum/n : 0;
}
function subjLearned(si){
  var code = SUBJ[si].subject, n = 0, tot = 0;
  for(var c in P){ if(P[c].s.subject === code){ tot++; if(S.rev[c]) n++; } }
  return { learned:n, total:tot };
}
function streak(){
  var n = 0, d = new Date();
  if(!S.checkin[dayKey(d)]) d.setDate(d.getDate()-1);
  while(S.checkin[dayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ============================ 路由 ============================ */
var stack = [{ n:"home" }];
var pushed = 0;                       // 我们自己 push 了多少条历史
function screen(){ return stack[stack.length-1]; }
function go(n, params){
  stack.push({ n:n, p:params||{} });
  pushed++;
  try{ history.pushState({ d:pushed }, ""); }catch(e){}
  render(); window.scrollTo(0,0);
}
function back(){
  if(stack.length <= 1) return;
  if(pushed > 0){ try{ history.back(); return; }catch(e){} }   // 交给 popstate 统一处理
  stack.pop(); render(); window.scrollTo(0,0);
}
window.addEventListener("popstate", function(){
  if(stack.length > 1){
    stack.pop();
    if(pushed > 0) pushed--;
    render(); window.scrollTo(0,0);
  }
});
function reset(n){ stack = [{ n:n }]; pushed = 0; render(); window.scrollTo(0,0); }

/* ============================ 小工具 ============================ */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function h(html){ document.getElementById("app").innerHTML = html; }
function lines(p){
  var out = [];
  String(p.content||"").split("\n").forEach(function(r){
    r = r.replace(/\s+$/,""); if(!r.trim()) return;
    var i = r.indexOf("｜");
    out.push(i>=0 ? { lb:r.slice(0,i).trim(), dt:r.slice(i+1).trim() } : { lb:"", dt:r.trim() });
  });
  return out;
}
function norm(s){ return String(s||"").trim().toLowerCase().replace(/[\s。，,\.\?？!！"'’“”;；:：]/g,""); }
function judge(q, user){
  if(!String(user||"").trim()) return false;
  if(q.type === "choice") return String(q.answer||"").trim().toUpperCase().charAt(0) === String(user).trim().toUpperCase().charAt(0);
  var e = String(q.answer||"").split("|").map(norm), g = String(user).split("|").map(norm);
  if(e.length <= 1) return norm(q.answer) === norm(user);
  if(e.length !== g.length) return e.join("") === g.join("");
  return e.every(function(v,i){ return v === g[i]; });
}
function qkey(x, qi){ return x.code + "#" + qi; }

/* ============================ 组件 ============================ */
function mascotSVG(){
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'
   + '<rect x="16" y="24" width="68" height="54" rx="11" fill="#3E8E68"/>'
   + '<rect x="16" y="24" width="13" height="54" rx="6.5" fill="#2F6B50"/>'
   + '<rect x="66" y="24" width="7" height="20" rx="3.5" fill="#F5EBD8"/>'
   + '<circle cx="47" cy="50" r="5.4" fill="#fff"/><circle cx="65" cy="50" r="5.4" fill="#fff"/>'
   + '<circle cx="48" cy="51" r="2.6" fill="#2F6B50"/><circle cx="66" cy="51" r="2.6" fill="#2F6B50"/>'
   + '<path d="M50 62 q6.5 5.5 13 0" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
   + '</svg>';
}
var TABICON = {
  home:'<path d="M3.5 10.6 12 3.6l8.5 7v9.4a1.4 1.4 0 0 1-1.4 1.4h-4.3v-6.2H9.2v6.2H4.9a1.4 1.4 0 0 1-1.4-1.4z"/>',
  book:'<path d="M4 4.6h6.2A2.8 2.8 0 0 1 13 7.4V20a2.4 2.4 0 0 0-2.2-1.3H4z"/><path d="M20 4.6h-6.2A2.8 2.8 0 0 0 11 7.4V20a2.4 2.4 0 0 1 2.2-1.3H20z"/>',
  math:'<rect x="4.5" y="3.5" width="15" height="17" rx="2.6"/><path d="M8 8.5h8M8 13h2.6M13.5 13h2.6M8 17h2.6M13.5 17h2.6"/>',
  abc:'<path d="M5 19.5 11.2 4.5h1.6L19 19.5M8 14.4h8"/>',
  review:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.5 3.5V9H15"/><path d="M12 8.2V12l2.6 1.7"/>'
};
function activeTab(){
  var sc = screen();
  if(sc.n === "home") return "home";
  if(sc.n === "subject" || sc.n === "unit") return SUBJ[sc.p.subj] ? SUBJ[sc.p.subj].subject : "home";
  if(sc.n === "detail") return P[sc.p.code] ? P[sc.p.code].s.subject : "home";
  if(sc.n === "flash" || sc.n === "quiz"){
    var c = sc.p.codes && sc.p.codes[0];
    if(c && P[c]) return P[c].s.subject;
    return "review";
  }
  if(sc.n === "wrong" || sc.n === "stats" || sc.n === "settings") return "review";
  return "home";
}
function gotoTab(top){
  stack = [top];
  pushed = 0;
  render();
  window.scrollTo(0,0);
}
function tabbar(){
  var active = activeTab();
  var items = [
    { k:"home",    t:"首页", i:"home", go:function(){ gotoTab({ n:"home" }); } },
    { k:"chinese", t:"语文", i:"book", go:function(){ gotoTab({ n:"subject", p:{ subj:0 } }); } },
    { k:"math",    t:"数学", i:"math", go:function(){ gotoTab({ n:"subject", p:{ subj:1 } }); } },
    { k:"english", t:"英语", i:"abc",  go:function(){ gotoTab({ n:"subject", p:{ subj:2 } }); } },
    { k:"review",  t:"复习", i:"review", go:function(){ gotoTab({ n:"review" }); } }
  ];
  document.getElementById("tabs").innerHTML = '<div class="in">' + items.map(function(it){
    return '<button data-tab="'+it.k+'" aria-selected="'+(active===it.k)+'">'
      + '<svg viewBox="0 0 24 24">'+TABICON[it.i]+'</svg><span>'+it.t+'</span></button>';
  }).join("") + '</div>';
  document.querySelectorAll("#tabs button").forEach(function(b){
    b.onclick = function(){
      var it = items.filter(function(x){ return x.k === b.dataset.tab; })[0];
      if(it) it.go();
    };
  });
}

/* ============================ 页面：首页 ============================ */
function pageHome(){
  var t = today(), mins = Math.round(todayMin());
  var goal = S.cfg.goal || 20;
  var due = dueList(), fr = freshList(3);
  var tasks = due.slice(0, 3);
  if(tasks.length < 3 && fr.length){
    tasks = tasks.concat(fr.slice(0, 3 - tasks.length));
  }
  var bubble = mins === 0 ? "今天还没开始，我们先看一个知识点吧。"
             : mins < 10 ? "刚开始就很棒，继续加油！"
             : mins < goal ? "慢慢来，今天也很好。"
             : "今天的目标完成啦，真厉害！";

  var tasksHTML = tasks.length ? tasks.map(function(x){
    var isNew = !S.rev[x.code];
    var isDone = !!(S.done[t] && S.done[t][x.code]);
    var m = Math.round(mastery(x.code)*100);
    return '<div class="task" data-code="'+esc(x.code)+'">'
      + '<span class="dot" style="background:'+(COLORS[x.s.subject]||"#2F6B50")+'"></span>'
      + '<div class="body"><div class="t">'+esc(x.p.title)+'</div>'
      + '<div class="m"><span class="chip">'+esc(x.s.subjectName)+'</span>'
      + '<span class="chip">'+esc(x.u.title)+'</span>'
      + (isNew ? '<span class="chip done">新学</span>' : '<span class="chip">'+(isDone?"已完成":"待复习")+'</span>')
      + (m ? '<span class="chip">掌握 '+m+'%</span>' : '')
      + '</div></div>'
      + '<button class="dobtn'+(isDone?" ok":"")+'" data-act="'+(isDone?"undo":"do")+'">'+(isDone?"✓ 已完成":"完成")+'</button>'
      + '</div>';
  }).join("") : '<div class="card" style="text-align:center;color:var(--ink2);font-size:.86rem">今天没有待复习的内容，去知识树里挑一个吧 🎉</div>';

  var subjCards = SUBJ.map(function(s, si){
    var m = Math.round(subjMastery(si)*100), l = subjLearned(si);
    return '<button class="card" data-gosubj="'+si+'" style="display:block;width:100%;text-align:left">'
      + '<div class="row"><span class="ico" style="background:'+COLORS[s.subject]+'22">'+ICONS[s.subject]+'</span>'
      + '<div class="tx"><div class="tt">'+esc(s.subjectName)+' <span style="font-weight:400;font-size:.72rem;color:var(--ink2)">'+esc(s.edition)+'</span></div>'
      + '<div class="ss">已学 '+l.learned+'/'+l.total+' 个知识点 · 掌握 '+m+'%</div></div>'
      + '<span class="chev">›</span></div>'
      + '<div class="bar"><i style="width:'+m+'%;background:'+(COLORS[s.subject]||"#3E8E68")+'"></i></div></button>';
  }).join("");

  return '<div class="page">'
  + '<div class="top"><h1>四年级学习</h1><span class="pill">上下册</span><span class="sp"></span>'
  + '<button class="avbtn" data-go="settings" aria-label="设置">'+mascotSVG()+'</button></div>'

  + '<div class="mascot"><div class="circle">'+mascotSVG()+'</div><div class="bubble">'+esc(bubble)+'</div></div>'
  + '<div class="bigtitle">四年级学习</div>'

  + '<div class="hero"><div class="num">'+mins+'<span>分钟</span></div>'
  + '<div class="sub">今日 · 每天进步一点点。</div>'
  + '<div class="bar"><i style="width:'+Math.min(100, Math.round(mins/goal*100))+'%"></i></div></div>'
  + '<div class="quote">“'+esc(QUOTES[S.cfg.quote])+'”</div>'

  + '<div class="sec"><h2>今天要处理</h2><span class="n">'+tasks.length+' 件</span></div>'
  + tasksHTML

  + '<div class="sec"><h2>快捷入口</h2></div>'
  + '<div class="grid2">'
  + '<button class="tile" data-go="flash"><div class="e">🃏</div><div class="t">抽认卡</div><div class="s">'+(due.length||"自主")+' 张待复习</div></button>'

/* ============================ 页面：科目 ============================ */
function pageSubject(si){
  var s = SUBJ[si];
  if(!s) return '<div class="page"><div class="empty">找不到这个科目</div></div>';
  var st = screen().p || {};
  var mode = st.mode || "tree";
  if(mode === "cheat") return pageCheat(si);

  var terms = {}, order = [];
  s.units.forEach(function(u, ui){
    if(!terms[u.term]){ terms[u.term] = []; order.push(u.term); }
    terms[u.term].push(ui);
  });
  var body = order.map(function(term){
    var cards = terms[term].map(function(ui){
      var u = s.units[ui], done = 0;
      u.points.forEach(function(p){ if(S.rev[s.subject+":"+p.id]) done++; });
      var m = 0; u.points.forEach(function(p){ m += mastery(s.subject+":"+p.id); });
      m = u.points.length ? Math.round(m/u.points.length*100) : 0;
      return '<button class="card" data-gounit="'+ui+'" style="display:block;width:100%;text-align:left">'
        + '<div class="row"><div class="tx"><div class="tt">'+esc(u.title)+'</div>'
        + '<div class="ss">'+u.points.length+' 个知识点 · 已学 '+done+' · 掌握 '+m+'%</div></div>'
        + '<span class="chev">›</span></div>'
        + '<div class="bar"><i style="width:'+m+'%;background:'+(COLORS[s.subject]||"#3E8E68")+'"></i></div></button>';
    }).join("");
    return '<div class="sec"><h2>'+esc(term)+'</h2></div>' + cards;
  }).join("");

  return '<div class="page">'
  + '<div class="top"><h1>'+ICONS[s.subject]+' '+esc(s.subjectName)+'</h1><span class="pill">'+esc(s.edition)+'</span></div>'
  + '<div class="seg">'
  + '<button data-seg="tree" aria-selected="'+(mode==="tree")+'">知识树</button>'
  + '<button data-seg="cheat" aria-selected="'+(mode==="cheat")+'">速记卡</button></div>'
  + body + '</div>';
}

function pageCheat(si){
  var s = SUBJ[si], all = [];
  s.units.forEach(function(u){ u.points.forEach(function(p){ all.push({u:u,p:p}); }); });
  var cards = all.map(function(x){
    var code = s.subject + ":" + x.p.id, on = !!S.fav[code];
    return '<div class="card"><div class="row" style="align-items:flex-start">'
      + '<div class="tx"><div class="tt">'+esc(x.p.title)+'</div>'
      + '<div class="ss" style="margin-top:5px;color:var(--ink)">'+esc(x.p.summary)+'</div>'
      + (x.p.formula ? '<div class="ss" style="color:var(--green);font-weight:600">'+esc(x.p.formula)+'</div>' : '')
      + (x.p.tips ? '<div class="ss">⚠️ '+esc(x.p.tips)+'</div>' : '')
      + '<div class="ss" style="margin-top:6px">'+esc(x.u.term)+' · '+esc(x.u.title)+'</div></div>'
      + '<button class="star '+(on?"on":"")+'" data-fav="'+esc(code)+'">'+(on?"★":"☆")+'</button>'
      + '</div></div>';

  return '<div class="page">'
  + '<div class="top"><h1>'+ICONS[s.subject]+' '+esc(s.subjectName)+'</h1><span class="pill">期末速记卡</span></div>'
  + '<div class="seg">'

}

function quizHTML(x, qi, q){
  var key = qkey(x, qi);
  var kind = q.type === "choice" ? "选择" : (q.type === "spell" ? "听写" : "填空");
  var hh = '<div class="quiz" data-key="'+esc(key)+'">'
    + '<div class="tags"><span class="tag">'+kind+'</span>'
    + (q.audio ? '<span class="tag g">🔊 '+esc(q.audio)+'</span>' : '')+'</div>'
    + '<div class="qtext">'+esc(q.question)+'</div>';
  if(q.type === "choice"){
    hh += '<div class="opts">';
    (q.options||[]).forEach(function(o, oi){
      var L = "ABCDEF".charAt(oi);
      var txt = String(o).replace(/^\s*[A-Fa-f]\s*[\.、．\)）:：]\s*/,"");
      hh += '<button class="opt" data-opt="'+L+'"><span class="k">'+L+'</span><span>'+esc(txt)+'</span></button>';
    });
    hh += '</div>';
  }else{
    hh += '<div class="fillrow"><input type="text" placeholder="'+(q.type==="spell"?"写出英文…":"填写答案…")+'">'
      + '<button class="btn g" data-act="check">检查</button>'
      + '<button class="btn" data-act="reveal">看答案</button></div>';
  }
  return hh + '</div>';
}

function feedback(ok, q, revealed){
  return '<div class="fb'+(ok?"":" bad")+'"><b>'+(revealed?"答案":(ok?"✅ 答对了":"❌ 再想想"))+'</b>'
    + '<span class="a">正确答案：'+esc(q.answer)+'</span>'
    + (q.explanation ? '<div class="x">'+esc(q.explanation)+'</div>' : '')
    + (ok||revealed ? '' : '<div class="x">已自动加入错题本 📕</div>')
    + '</div>';
}

/* ============================ 页面：统计 ============================ */
function pageStats(){
  var days = [], maxV = 1;
  for(var i = 6; i >= 0; i--){
    var d = new Date(); d.setDate(d.getDate()-i);
    var k = dayKey(d), v = S.min[k] || 0;
    if(v > maxV) maxV = v;
    days.push({ k:k, label:(d.getMonth()+1)+"/"+d.getDate(), v:v });
  }
  var week = days.map(function(x){
    var hh = Math.max(4, Math.round(x.v/maxV*100));
    return '<div class="d"><div class="v">'+(x.v?Math.round(x.v):"")+'</div>'
      + '<div class="b'+(x.v?"":" zero")+'" style="height:'+hh+'%"></div>'
      + '<div class="l">'+x.label+'</div></div>';
  }).join("");

  var subjRows = SUBJ.map(function(s, si){
    var m = Math.round(subjMastery(si)*100), l = subjLearned(si);
    return '<button class="card" data-gosubj="'+si+'" style="display:block;width:100%;text-align:left">'
      + '<div class="row"><span class="ico" style="background:'+COLORS[s.subject]+'22">'+ICONS[s.subject]+'</span>'
      + '<div class="tx"><div class="tt">'+esc(s.subjectName)+'</div>'
      + '<div class="ss">已学 '+l.learned+'/'+l.total+' · 掌握 '+m+'%</div></div></div>'
      + '<div class="bar"><i style="width:'+m+'%;background:'+(COLORS[s.subject]||"#3E8E68")+'"></i></div></button>';
  }).join("");

  var weak = [];
  for(var c in P){ if(S.pt[c] && S.pt[c].a >= 1 && mastery(c) < .6) weak.push(P[c]); }
  weak.sort(function(a,b){ return mastery(a.code) - mastery(b.code); });
  var weakHTML = weak.length ? weak.slice(0,10).map(function(x){
    return '<div class="task" data-code="'+esc(x.code)+'"><span class="dot" style="background:'+(COLORS[x.s.subject]||"#2F6B50")+'"></span>'
      + '<div class="body"><div class="t">'+esc(x.p.title)+'</div>'
      + '<div class="m"><span class="chip">'+esc(x.s.subjectName)+'</span>'
      + '<span class="chip late">掌握 '+Math.round(mastery(x.code)*100)+'%</span></div></div>'
      + '<span class="chev">›</span></div>';
  }).join("") : '<div class="card" style="text-align:center;color:var(--ink2);font-size:.86rem">暂无薄弱知识点，继续做几道题吧</div>';

  var totalMin = 0; for(var k2 in S.min) totalMin += S.min[k2];
  var totA = 0, totC = 0;
  for(var c2 in S.pt){ totA += S.pt[c2].a; totC += S.pt[c2].c; }

  return '<div class="page"><div class="sheethead"><button class="back" data-back="1">‹</button><div class="ttl">学习统计</div></div>'
  + '<div class="stats3">'
  + '<div class="box"><div class="v">'+Math.round(totalMin)+'</div><div class="k">累计分钟</div></div>'
  + '<div class="box"><div class="v">'+(totA?Math.round(totC/totA*100):0)+'%</div><div class="k">答题正确率</div></div>'
  + '<div class="box"><div class="v">'+streak()+'</div><div class="k">连续打卡</div></div></div>'
  + '<div class="card"><h4 style="margin:0 0 4px;font-size:.9rem">近 7 天学习时长</h4><div class="week">'+week+'</div></div>'
  + '<div class="sec"><h2>分科掌握度</h2></div>' + subjRows
  + '<div class="sec"><h2>薄弱知识点</h2></div>' + weakHTML
  + '</div>';
}

function pageFlash(){
  var st = screen().p || {};
  var list = st.codes ? st.codes.filter(function(c){ return P[c]; }) : dueList().map(function(x){ return x.code; });
  if(!list.length) list = freshList(6).map(function(x){ return x.code; });
  return renderFlash(list, 0, false, { yes:0, no:0 });
}
function renderFlash(list, i, flip, tally){
  if(!list.length) return '<div class="page"><div class="empty"><div class="e">🃏</div>暂时没有需要复习的卡片</div></div>';
  if(i >= list.length){
    var tot = tally.yes + tally.no;
    return '<div class="page"><div class="result"><div class="e">🎉</div><h3>这一轮完成啦</h3>'
      + '<p>认识 '+tally.yes+' 张 · 待加强 '+tally.no+' 张</p>'
      + '<div class="stats3"><div class="box"><div class="v">'+tally.yes+'</div><div class="k">认识</div></div>'
      + '<div class="box"><div class="v">'+tally.no+'</div><div class="k">待加强</div></div>'
      + '<div class="box"><div class="v">'+(tot?Math.round(tally.yes/tot*100):0)+'%</div><div class="k">掌握率</div></div></div>'
      + '<button class="btn g" data-act="closesession" style="width:100%;padding:.9rem">完成</button></div></div>';
  }
  var x = P[list[i]], p = x.p;
  var back = '<div class="blk" style="background:var(--card2)">'
    + (p.summary ? '<div style="font-weight:700;color:var(--green);margin-bottom:8px">'+esc(p.summary)+'</div>' : '')
    + lines(p).slice(0,6).map(function(l){
        return '<div class="ln"><span class="i">•</span><span>'+(l.lb?'<span class="lb">'+esc(l.lb)+'</span>　':'')+'<span class="dt">'+esc(l.dt)+'</span></span></div>';
      }).join("")
    + (p.formula ? '<div class="blk formula" style="margin:8px 0 0">'+esc(p.formula)+'</div>' : '')
    + (p.tips ? '<div class="blk tips" style="margin:8px 0 0">⚠️ '+esc(p.tips)+'</div>' : '')
    + '</div>';
  return '<div class="page">'
  + '<div class="sheethead"><button class="back" data-act="closesession">‹</button>'
  + '<div class="ttl">抽认卡 '+Math.min(i+1,list.length)+' / '+list.length+'</div></div>'
  + '<div class="bar" style="margin-bottom:14px"><i style="width:'+Math.round(i/list.length*100)+'%"></i></div>'
  + '<div class="fc'+(flip?" flip":"")+'" data-flip="1"><div class="inner">'
  + '<div class="side front"><div class="tags" style="justify-content:center"><span class="tag">'+esc(x.s.subjectName)+'</span>'
  + '<span class="tag g">'+esc(x.u.title)+'</span></div>'
  + '<h3>'+esc(p.title)+'</h3>'
  + '<div class="hint">'+(p.summary?esc(p.summary):"")+'</div>'
  + '<div class="hint" style="margin-top:20px">👆 点一下卡片看要点</div></div>'
  + '<div class="side back2">'+back+'</div></div></div>'
  + '<div class="fcbtns"><button class="fcbtn no" data-flash="no">不认识</button>'
  + '<button class="fcbtn yes" data-flash="yes">认识</button></div>'
  + '</div>';
}

function pageQuiz(){
  var st = screen().p || {};
  if(!st.qs) st.qs = buildQuiz();          // 只在进入时生成一次，之后复用
  var qs = st.qs;
  if(!qs.length) return '<div class="page"><div class="empty"><div class="e">✏️</div>还没有足够的题目，先去知识树里看几个知识点吧</div></div>';
  if(st.i >= qs.length){
    var tot = st.correct + st.wrong;
    var rate = tot ? Math.round(st.correct/tot*100) : 0;
    return '<div class="page"><div class="result"><div class="e">'+(rate>=80?"🏅":"💪")+'</div>'
      + '<h3>'+(rate>=80?"太厉害了！":"继续加油！")+'</h3><p>本轮共 '+qs.length+' 题</p>'
      + '<div class="stats3"><div class="box"><div class="v">'+st.correct+'</div><div class="k">答对</div></div>'
      + '<div class="box"><div class="v">'+st.wrong+'</div><div class="k">答错</div></div>'
      + '<div class="box"><div class="v">'+rate+'%</div><div class="k">正确率</div></div></div>'
      + '<div class="grid2"><button class="tile" data-act="requiz"><div class="e">🔄</div><div class="t">再来一轮</div></button>'
      + '<button class="tile" data-act="closesession"><div class="e">✅</div><div class="t">完成</div></button></div></div></div>';
  }
  var item = qs[st.i], x = P[item.code], q = x.p.quiz[item.qi];
  return '<div class="page">'
  + '<div class="sheethead"><button class="back" data-act="closesession">‹</button>'
  + '<div class="ttl">第 '+(st.i+1)+' / '+qs.length+' 题</div>'
  + '<span class="pill">✓ '+st.correct+' ✗ '+st.wrong+'</span></div>'
  + '<div class="bar" style="margin-bottom:14px"><i style="width:'+Math.round(st.i/qs.length*100)+'%"></i></div>'
  + '<div class="card"><div class="tags"><span class="tag">'+esc(x.s.subjectName)+'</span>'
  + '<span class="tag g">'+esc(x.p.title)+'</span></div>'
  + quizHTML(x, item.qi, q) + '</div>'
  + '<button class="btn g" data-act="nextq" style="width:100%;padding:.9rem;margin-top:6px">下一题</button>'
  + '</div>';
}
function buildQuiz(){
  var pool = dueList().slice(0, 12);
  if(pool.length < 4) pool = pool.concat(freshList(8 - pool.length));
  var qs = [];
  pool.forEach(function(x){
    var n = (x.p.quiz||[]).length;
    for(var i = 0; i < n; i++) qs.push({ code:x.code, qi:i });
  });
  qs.sort(function(){ return Math.random() - .5; });
  return qs.slice(0, 8);
}

/* ============================ 渲染 ============================ */
function render(){
  var sc = screen(), html;
  switch(sc.n){
    case "home":     html = pageHome(); break;
    case "subject":  html = pageSubject(sc.p.subj); break;
    case "unit":     html = pageUnit(sc.p.subj, sc.p.ui); break;
    case "detail":   html = pageDetail(sc.p.code); break;
    case "review":   html = pageReview(); break;
    case "wrong":    html = pageWrong(); break;
    case "stats":    html = pageStats(); break;
    case "settings": html = pageSettings(); break;
    case "flash":    html = pageFlash(); break;
    case "quiz":     html = pageQuiz(); break;
    default:         html = pageHome();
  }
  h(html);
  tabbar();
  document.documentElement.setAttribute("data-theme", S.cfg.theme);
  document.documentElement.style.setProperty("--scale", S.cfg.scale);
  var m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute("content", S.cfg.theme === "dark" ? "#12160F" : "#FAF8F3");
}

/* ============================ 交互 ============================ */
function findQ(el){ return el.closest ? el.closest(".quiz") : null; }

document.addEventListener("click", function(e){
  var t = e.target;
  var btn = t.closest ? t.closest("button") : null;
  var sc = screen();

  /* 收藏 */
  if(btn && btn.dataset.fav !== undefined){
    var fc = btn.dataset.fav;
    if(S.fav[fc]) delete S.fav[fc]; else S.fav[fc] = 1;
    btn.classList.toggle("on"); btn.textContent = S.fav[fc] ? "★" : "☆";
    save(); return;
  }
  /* 返回 */
  if(btn && btn.dataset.back !== undefined){ back(); return; }

  /* 底部 Tab / 首页跳转 */
  if(btn && btn.dataset.gosubj !== undefined){
    gotoTab({ n:"subject", p:{ subj:+btn.dataset.gosubj } }); return;
  }
  if(btn && btn.dataset.gounit !== undefined){ go("unit", { subj:sc.p.subj, ui:+btn.dataset.gounit }); return; }
  if(btn && btn.dataset.openpt !== undefined){ go("detail", { code:btn.dataset.openpt }); return; }
  if(btn && btn.dataset.gopt !== undefined){ go("detail", { code:btn.dataset.gopt }); return; }
  if(btn && btn.dataset.seg){
    sc.p.mode = btn.dataset.seg; render(); window.scrollTo(0,0); return;
  }
  if(btn && btn.dataset.go){
    var g = btn.dataset.go;
    if(g === "flash"){ go("flash", {}); return; }
    if(g === "quiz"){ go("quiz", { i:0, correct:0, wrong:0 }); return; }
    if(g === "wrong"){ go("wrong", {}); return; }
    if(g === "stats"){ go("stats", {}); return; }
    if(g === "settings"){ go("settings", {}); return; }
  }
  /* 任务卡：点标题进详情；点完成 */
  var task = t.closest ? t.closest(".task") : null;  if(btn && btn.dataset.act === "do" && task){
    var code = task.dataset.code, tk = today();
    S.done[tk] = S.done[tk] || {}; S.done[tk][code] = 1;
    if(!S.rev[code]) S.rev[code] = { stage:0, date:tk };
    schedule(code, true);
    addMin(1, code.split(":")[0]);
    btn.textContent = "✓ 已完成"; btn.classList.add("ok"); save();
    return;
  }
  if(btn && btn.dataset.act === "undo" && task){
    var code2 = task.dataset.code, tk2 = today();
    if(S.done[tk2]) delete S.done[tk2][code2];
    btn.textContent = "完成"; btn.classList.remove("ok"); save(); return;
  }
  if(task && !btn){ go("detail", { code:task.dataset.code }); return; }

  /* 知识点卡：整卡可点（收藏按钮已在前面拦截） */
  var ptEl = t.closest ? t.closest(".pt[data-openpt]") : null;
  if(ptEl && !btn){ go("detail", { code:ptEl.dataset.openpt }); return; }

  /* 打卡 */
  if(btn && btn.dataset.act === "checkin"){
    S.checkin[today()] = 1; save();
    btn.textContent = "✓ 已打卡"; btn.classList.add("ok"); render(); return;
  }

  /* 错题本 */
  if(btn && btn.dataset.master !== undefined){
    var x0 = P[S.wrong[btn.dataset.master] ? S.wrong[btn.dataset.master].code : ""];
    if(x0) schedule(x0.code, true);
    delete S.wrong[btn.dataset.master]; save(); render(); return;
  }

  /* 设置 */
  if(btn && btn.dataset.act === "theme"){ S.cfg.theme = S.cfg.theme === "light" ? "dark" : "light"; save(); render(); return; }
  if(btn && btn.dataset.act === "resetday"){
    S.min[today()] = 0; S.done[today()] = {}; S.checkin[today()] && delete S.checkin[today()]; save(); render(); return;
  }
  if(btn && btn.dataset.act === "resetall"){
    if(confirm("确定清空全部学习数据吗？教材内容会保留。")){
      S.min = {}; S.minSub = {}; S.ans = {}; S.pt = {}; S.rev = {}; S.wrong = {}; S.fav = {}; S.checkin = {}; S.done = {};
      save(); render();
    }
    return;
  }

  /* 从详情启动测验 / 抽认卡 */
  if(btn && btn.dataset.startquiz){
    var c = btn.dataset.startquiz, x = P[c], qs = [];
    (x.p.quiz||[]).forEach(function(q,i){ qs.push({ code:c, qi:i }); });
    go("quiz", { i:0, correct:0, wrong:0, qs:qs }); return;
  }
  if(btn && btn.dataset.startflash){ go("flash", { codes:[btn.dataset.startflash] }); return; }

  /* 抽认卡 */
  if(btn && btn.dataset.flash){
    var list = sc.p.codes ? sc.p.codes : null;
    if(!list){
      list = dueList().map(function(x){ return x.code; });
      if(!list.length) list = freshList(6).map(function(x){ return x.code; });
    }
    var i = sc.p.i || 0, tally = sc.p.tally || { yes:0, no:0 };
    var code3 = list[i];
    if(code3 && P[code3]){
      schedule(code3, btn.dataset.flash === "yes");
      if(btn.dataset.flash === "yes") tally.yes++; else tally.no++;
      addMin(0.4, code3.split(":")[0]);
    }
    sc.p = { codes:list, i:i+1, tally:tally };
    render(); window.scrollTo(0,0); return;
  }
  if(btn && btn.dataset.act === "closesession"){ back(); return; }
  if(btn && btn.dataset.act === "requiz"){ sc.p = { i:0, correct:0, wrong:0, qs:buildQuiz() }; render(); window.scrollTo(0,0); return; }

  /* 卡片翻转 */
  var fc = t.closest ? t.closest(".fc") : null;
  if(fc && !btn){ fc.classList.toggle("flip"); return; }

  /* 答题 */
  var quiz = findQ(t);
  if(btn && quiz && !quiz.dataset.done){
    var key = quiz.dataset.key;
    var item = null;
    if(sc.n === "detail"){
      var xx = P[sc.p.code];
      var qi = +key.split("#")[1];
      item = { x:xx, q:xx.p.quiz[qi] };
    }else if(sc.n === "quiz"){
      var it = (sc.p.qs||[])[sc.p.i];
      if(it){ var xy = P[it.code]; item = { x:xy, q:xy.p.quiz[it.qi] }; }
    }
    if(!item || !item.q) return;
    var q = item.q, ok = false, user = "";

    if(btn.dataset.opt){
      user = btn.dataset.opt;
      ok = judge(q, user);
      var ans = String(q.answer||"").trim().toUpperCase().charAt(0);
      quiz.querySelectorAll(".opt").forEach(function(o){
        if(o.dataset.opt === ans) o.classList.add("right");
      });
      if(!ok) btn.classList.add("wrong");
    }else if(btn.dataset.act === "check"){
      var inp = quiz.querySelector("input");
      user = inp ? inp.value : "";
      ok = judge(q, user);
    }else if(btn.dataset.act === "reveal"){
      quiz.dataset.done = "1";
      quiz.insertAdjacentHTML("beforeend", feedback(true, q, true));
      if(sc.n === "quiz") sc.p.revealed = true;
      return;
    }else{ return; }

    quiz.dataset.done = "1";
    quiz.insertAdjacentHTML("beforeend", feedback(ok, q, false));

    /* 记录 */
    var cd = item.x.code;
    S.pt[cd] = S.pt[cd] || { a:0, c:0 };
    S.pt[cd].a++; if(ok) S.pt[cd].c++;
    var t2 = today();
    S.ans[t2] = S.ans[t2] || {};
    if(!S.ans[t2][cd]) S.ans[t2][cd] = { a:0, c:0 };
    S.ans[t2][cd].a++; if(ok) S.ans[t2][cd].c++;
    addMin(0.5, cd.split(":")[0]);
    schedule(cd, ok);
    if(!ok){
      var kk = cd + "#" + (sc.n === "detail" ? +key.split("#")[1] : (key.split("#")[1]));
      var ex = S.wrong[kk];
      S.wrong[kk] = { code:cd, q:q.question, user:user, answer:q.answer, exp:q.explanation, n:(ex?ex.n:0)+1 };
    }else if(S.wrong[cd + "#" + key.split("#")[1]]){ delete S.wrong[cd + "#" + key.split("#")[1]]; }
    save();

    if(sc.n === "quiz"){ if(ok) sc.p.correct++; else sc.p.wrong++; }
    return;
  }

  if(btn && btn.dataset.act === "nextq"){
    sc.p.i = (sc.p.i||0) + 1;
    render(); window.scrollTo(0,0); return;
  }
});

/* 滑块 */
document.addEventListener("input", function(e){
  var t = e.target;
  if(t.dataset && t.dataset.act === "scale"){
    S.cfg.scale = parseFloat(t.value);
    document.documentElement.style.setProperty("--scale", S.cfg.scale);
    t.closest(".sw").querySelector(".l").textContent = "字号：" + Math.round(S.cfg.scale*100) + "%";
    save();
  }
  if(t.dataset && t.dataset.act === "goal"){
    S.cfg.goal = parseInt(t.value, 10);
    t.closest(".sw").querySelector(".l").textContent = "每日目标：" + S.cfg.goal + " 分钟";
    save();
  }
});

/* ============================ 启动 ============================ */
load();
render();

/* 用 http(s) 打开时注册 Service Worker，装到主屏幕后可离线使用；
   用 file:// 直接打开时跳过（浏览器不允许本地文件注册 SW）。 */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

/* ============================ 可选自检 ============================ */
/* 在网址后面加 ?selftest=1 会跑一遍内部检查并把结果打印在页面上，方便改完内容后验证。 */
if(/[?&]selftest=1/.test(location.search)){
  (function(){
    var backup = JSON.stringify(S);
    var out = [], pass = 0, fail = 0;
    function ok(name, cond){ if(cond){ pass++; } else { fail++; } out.push((cond ? "PASS  " : "FAIL  ") + name); }
    function noThrow(name, fn){ try{ fn(); ok(name, true); }catch(e){ ok(name + " → " + e.message, false); } }

    ok("数据：3 个科目", SUBJ.length === 3);
    ok("数据：146 个知识点", Object.keys(P).length === 146);
    ok("数据：38 个单元", Object.keys(U).length === 38);

    noThrow("渲染：首页",       function(){ gotoTab({ n:"home" }); });
    noThrow("渲染：语文知识树", function(){ gotoTab({ n:"subject", p:{ subj:0 } }); });
    noThrow("渲染：数学知识树", function(){ gotoTab({ n:"subject", p:{ subj:1 } }); });
    noThrow("渲染：英语知识树", function(){ gotoTab({ n:"subject", p:{ subj:2 } }); });
    noThrow("渲染：速记卡",     function(){ gotoTab({ n:"subject", p:{ subj:0, mode:"cheat" } }); });
    noThrow("渲染：单元列表",   function(){ gotoTab({ n:"subject", p:{ subj:0 } }); go("unit", { subj:0, ui:0 }); });
    noThrow("渲染：知识点详情", function(){ go("detail", { code:Object.keys(P)[0] }); });
    noThrow("渲染：复习",       function(){ gotoTab({ n:"review" }); });
    noThrow("渲染：错题本",     function(){ gotoTab({ n:"wrong" }); });
    noThrow("渲染：统计",       function(){ gotoTab({ n:"stats" }); });
    noThrow("渲染：设置",       function(){ gotoTab({ n:"settings" }); });
    noThrow("渲染：抽认卡",     function(){ gotoTab({ n:"flash", p:{} }); });
    noThrow("渲染：小测验",     function(){ gotoTab({ n:"quiz", p:{ i:0, correct:0, wrong:0 } }); });

    var cq = null, fq = null;
    for(var c in P){
      (P[c].p.quiz || []).forEach(function(q){ if(!cq && q.type === "choice") cq = q; if(!fq && q.type !== "choice") fq = q; });
      if(cq && fq) break;
    }
    var rightL = String(cq.answer).trim().toUpperCase().charAt(0);
    ok("判分：选择题答对", judge(cq, rightL) === true);
    ok("判分：选择题答错", judge(cq, rightL === "A" ? "B" : "A") === false);
    ok("判分：填空答对",   judge(fq, fq.answer) === true);
    ok("判分：空答案算错", judge(fq, "") === false);

    var t0 = Object.keys(P)[0];
    S.rev[t0] = { stage:0, date:today() };
    schedule(t0, true);
    var st1 = S.rev[t0].stage;
    schedule(t0, false);
    var st2 = S.rev[t0].stage;
    ok("复习排程：答对进下一阶段", st1 === 1);
    ok("复习排程：答错回到第一天", st2 === 0);
    ok("复习排程：写入复习日期", /^\d{4}-\d{2}-\d{2}$/.test(S.rev[t0].date));

    S.checkin[today()] = 1;
    ok("打卡：连续天数 ≥ 1", streak() >= 1);
    var m0 = todayMin();
    addMin(2, "chinese");
    ok("时长：累加生效", todayMin() >= m0 + 2);

    S.wrong["__selftest__#0"] = { code:t0, q:"自检用题", user:"A", answer:"B", exp:"", n:1 };
    noThrow("渲染：带错题的错题本", function(){ gotoTab({ n:"wrong" }); });
    delete S.wrong["__selftest__#0"];

    gotoTab({ n:"home" });
    go("stats", {});
    go("settings", {});
    ok("导航：栈深度为 3", stack.length === 3);
    stack.pop(); render();
    ok("导航：回退后为 2", stack.length === 2);

    gotoTab({ n:"home" });
    ok("DOM：底部 5 个 Tab", document.querySelectorAll("#tabs button").length === 5);
    ok("DOM：首页主卡片存在", !!document.querySelector(".hero"));
    ok("DOM：吉祥物已渲染", !!document.querySelector(".mascot svg"));
    ok("DOM：首页任务卡存在", document.querySelectorAll("#app .task").length > 0);

    S = JSON.parse(backup); save();

    document.getElementById("app").innerHTML =
      '<div class="page"><pre style="white-space:pre-wrap;font-size:12px;line-height:1.75;font-family:ui-monospace,Menlo,monospace">'
      + "自检结果：" + pass + " 通过 / " + fail + " 失败\n\n" + out.join("\n") + "</pre></div>";
    document.getElementById("tabs").innerHTML = "";
  })();
}

window.__app = { S:S, P:P, SUBJ:SUBJ, render:render, stack:function(){ return stack; } };
})();
</script>
